<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- One real Set card: a single red striped oval, drawn like the in-game
       classic card (the symbol is Card.tsx's 100x250 oval, scaled 1.45x). -->
  <defs>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="512" height="36">
      <line x1="0" y1="18" x2="512" y2="18" stroke="#e4002b" stroke-width="10" />
    </pattern>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="#ffffff" stroke="#d3d7e3" stroke-width="16" />
  <rect x="195" y="80" width="122" height="352" rx="61" fill="url(#stripes)" stroke="#e4002b" stroke-width="14" stroke-linejoin="round" />
</svg>
